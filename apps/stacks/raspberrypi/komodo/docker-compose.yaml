name: komodo

services:

  mongo:
    image: mongo:7
    container_name: komodo-mongo
    labels:
      komodo.skip: "true"
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG}
    container_name: komodo-core
    init: true
    labels:
      komodo.skip: "true"
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "9120:9120"
    env_file:
      - .env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
    volumes:
      - keys:/config/keys
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
      - ${COMPOSE_KOMODO_SYNCS_PATH}:/syncs
    networks:
      - default
      - proxy_network

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG}
    container_name: komodo-periphery
    init: true
    labels:
      komodo.skip: "true"
    restart: unless-stopped
    depends_on:
      - core
    env_file:
      - .env
    volumes:
      - keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # O caminho dentro do contêiner é o mesmo do host.
      - ${PERIPHERY_ROOT_DIRECTORY}:${PERIPHERY_ROOT_DIRECTORY}

networks:
  proxy_network:
    external: true
    name: proxy_network

volumes:
  mongo-data:
  mongo-config:
  keys:
