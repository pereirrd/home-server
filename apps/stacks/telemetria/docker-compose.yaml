services:

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ${STACK_DIR}/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${STACK_DIR}/mosquitto/config/acl:/mosquitto/config/acl:ro
      - ${STACK_DIR}/mosquitto/config/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
    networks:
      proxy_network:
        aliases:
          - telemetria-mosquitto

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      proxy_network:
        aliases:
          - telemetria-influxdb

  telegraf:
    image: telegraf:1.32
    restart: unless-stopped
    environment:
      MQTT_TELEGRAF_PASSWORD: ${MQTT_TELEGRAF_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ${STACK_DIR}/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ${STACK_DIR}/telegraf/glances.star:/etc/telegraf/glances.star:ro
    depends_on:
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy
    networks:
      - proxy_network

  grafana:
    image: grafana/grafana:11.6.16
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - grafana_data:/var/lib/grafana
      - ${STACK_DIR}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${STACK_DIR}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      proxy_network:
        aliases:
          - telemetria-grafana

networks:
  proxy_network:
    external: true
    name: proxy_network

volumes:
  mosquitto_data:
  influxdb_data:
  influxdb_config:
  grafana_data:
