# IRK Capture — captures Apple/Android Bluetooth Identity Resolving Keys (IRK)
# Package: https://github.com/DerekSeaman/irk-capture
# Requires ESP-IDF (Arduino framework is NOT supported).

esphome:
  name: esphome-irk-capture
  friendly_name: esphome-irk-capture

# Replace this with your actual platform if you aren't using ESP32.
esp32:
  variant: esp32c3 # Change: Your ESP32 variant (esp32, esp32c3, esp32c6, esp32s3, etc.)
  board: esp32-c3-devkitm-1 # Change: Your ESP32 board ID

logger:

api:
  encryption:
    key: !secret api_key # Change: Generated with ESPHome new device wizard

ota:

packages:
  device:
    url: https://github.com/DerekSeaman/irk-capture
    ref: main
    file: ESPHome Devices/irk-capture-base.yaml
    refresh: always

# Override the package Wi-Fi config with local secrets
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

